<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contrôle Servo via WebSocket</title>
</head>
<body>
    <h1>Contrôle du Servo</h1>
    <input type="range" id="angle" min="0" max="180" value="90">
    <p>Angle envoyé: <span id="angleValue">90</span>°</p>

    <h2>Retour ESP32</h2>
    <p>Servo actuel: <span id="servoAngle">--</span>°</p>
    <p>GPIO5: <span id="gpio5">--</span></p>

    <script>
        const ws = new WebSocket("ws://" + location.hostname + ":8080");
        const angleSlider = document.getElementById("angle");
        const angleValue = document.getElementById("angleValue");
        const servoAngle = document.getElementById("servoAngle");
        const gpio5 = document.getElementById("gpio5");

        ws.onopen = () => {
            console.log("Connexion WebSocket établie.");
        };

        ws.onmessage = (event) => {
            console.log("Message reçu:", event.data);

            try {
                const data = JSON.parse(event.data);
                if (data.angle !== undefined) {
                    servoAngle.textContent = data.angle;
                }
                if (data.gpio5 !== undefined) {
                    gpio5.textContent = data.gpio5 ? "HIGH (1)" : "LOW (0)";
                }
            } catch(e) {
                console.log("Non-JSON message:", event.data);
            }
        };

        angleSlider.addEventListener("input", () => {
            const angle = angleSlider.value;
            angleValue.textContent = angle;
            ws.send(`angle=${angle}`);
        });
    </script>
</body>
</html>
